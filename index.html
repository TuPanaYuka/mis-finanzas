function ic(name,size){var s=size||18;return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(ICONS[name]||ICONS.info)+'</svg>';}
function $(id){return document.getElementById(id);}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function uid(){return Math.random().toString(36).slice(2,10);}
function safeId(id){var v=String(id==null?'':id);return /^[a-zA-Z0-9_-]{1,48}$/.test(v)?v:uid();}
function stableId(raw,prefix,used){var v=String(raw==null?'':raw).trim();var base;if(/^[a-zA-Z0-9_-]{1,48}$/.test(v))base=v;else if(v)base=prefix+'-'+hash(v).toString(36);else base=prefix+'-'+uid();var out=base,i=2;while(used[out])out=base+'-'+(i++);used[out]=1;return out;}
function initials(name){var parts=String(name||'?').trim().split(/\s+/).filter(Boolean);if(!parts.length)return '?';if(parts.length===1)return parts[0].slice(0,2).toUpperCase();return (parts[0][0]+parts[parts.length-1][0]).toUpperCase();}
function hash(str){var h=0;str=String(str||'');for(var i=0;i<str.length;i++)h=((h<<5)-h+str.charCodeAt(i))|0;return Math.abs(h);}
function colorFor(name){return PALETTE[hash(name)%PALETTE.length];}
function personColor(account,id){var i=account.people.findIndex(function(p){return p.id===id;});return PALETTE[(i<0?0:i)%PALETTE.length];}
function localISO(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function todayISO(){return localISO(new Date());}
function normDate(v){var s=String(v||'');if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;var d=new Date(s);return isNaN(d.getTime())?todayISO():localISO(d);}
function addMonth(ym,n){var p=ym.split('-');var d=new Date(+p[0],+p[1]-1+n,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
function monthOf(iso){return String(iso||todayISO()).slice(0,7);}
function monthName(ym,long){var p=ym.split('-');var d=new Date(+p[0],+p[1]-1,1);var s=d.toLocaleDateString('es-AR',long?{month:'long',year:'numeric'}:{month:'short'});return s.charAt(0).toUpperCase()+s.slice(1);}
function monthShort(ym){return MONTHS[+ym.slice(5,7)-1];}

function animateCounters(){
  if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  var els=document.querySelectorAll('.kpi-value,.hero-amount,.summary-total');
  els.forEach(function(el){
    if(el.getAttribute('data-no-count')!=null)return;
    var raw=el.textContent.trim();
    var isPct=/%$/.test(raw);
    var numText=raw.replace(/US\$/g,'').replace(/%$/,'').trim();
    if(!/^-?[\d.,]+$/.test(numText))return;
    var target=parseAmount(numText);
    if(!isFinite(target)||Math.abs(target)<0.01)return;
    var started=null,dur=560;
    function frame(ts){
      if(!started)started=ts;
      var p=Math.min(1,(ts-started)/dur);
      var eased=1-Math.pow(1-p,3);
      var val=target*eased;
      el.textContent=isPct?pct(val):fmt(val);
      if(p<1)requestAnimationFrame(frame);else el.textContent=raw;
    }
    el.textContent=isPct?pct(0):fmt(0);
    requestAnimationFrame(frame);
  });
}

function catSortAmountMap(){
  var ym=state.catPeriod==='all'?null:state.cur,map={};
  S.tx.forEach(function(t){
    if(ym&&t.date.slice(0,7)!==ym)return;
    var c=catById(t.cat);
    if(!c)return;
    var k=c.parent||c.id;
    map[k]=(map[k]||0)+t.amt;
  });
  return map;
}
function sortedCats(type){
  var list=topCats(type).slice();
  var mode=state.catSort||'amount';
  var amounts=catSortAmountMap();
  var idx={};
  S.cats.forEach(function(c,i){idx[c.id]=i;});
  function amt(c){return amounts[c.id]||0;}
  function nameCmp(a,b){return String(a.name).localeCompare(String(b.name),'es',{sensitivity:'base'});}
  if(mode==='manual'){
    list.sort(function(a,b){
      var ao=a.ord==null?Number.MAX_SAFE_INTEGER:a.ord;
      var bo=b.ord==null?Number.MAX_SAFE_INTEGER:b.ord;
      if(ao!==bo)return ao-bo;
      return (idx[a.id]||0)-(idx[b.id]||0);
    });
  }else if(mode==='name'){
    list.sort(nameCmp);
  }else if(mode==='type'){
    var order={ingreso:0,gasto:1,ahorro:2,inversion:3};
    list.sort(function(a,b){
      var d=(order[a.type]||0)-(order[b.type]||0);
      if(d)return d;
      d=amt(b)-amt(a);
      if(d)return d;
      return nameCmp(a,b);
    });
  }else{
    list.sort(function(a,b){
      var d=amt(b)-amt(a);
      if(d)return d;
      return nameCmp(a,b);
    });
  }
  return list;
}

function catOrdNormalize(arr){
  var top=0;
  arr.forEach(function(c){if(!c.parent){c.ord=top++;}});
  return arr;
}
function catVisibleType(c){
  if(state.tab==='categorias')return state.catTab==='todos'?'':state.catTab;
  return c?c.type:'';

function applyCatOrder(type,ordered){
  var arr=S.cats.slice();
  var slots=[];
  arr.forEach(function(c,i){if(!c.parent&&(!type||c.type===type))slots.push(i);});
  var top=ordered.filter(function(c){return c&&!c.parent;});
  if(slots.length!==top.length)return false;
  slots.forEach(function(slot,i){arr[slot]=top[i];});
  S.cats=catOrdNormalize(arr);
  return true;
}
function reorderCat(sourceId,targetId){
  var source=catById(sourceId),target=catById(targetId);
  if(!source||!target||source.parent||target.parent)return;
  var type=catVisibleType(source);
  var list=sortedCats(type);
  var si=list.findIndex(function(c){return String(c.id)===String(sourceId);});
  var ti=list.findIndex(function(c){return String(c.id)===String(targetId);});
  if(si<0||ti<0||si===ti)return;
  var movingDown=si<ti;
  var moved=list.splice(si,1)[0];
  var ti2=list.findIndex(function(c){return String(c.id)===String(targetId);});
  if(ti2<0)return;
  list.splice(movingDown?ti2+1:ti2,0,moved);
  if(!applyCatOrder(type,list))return;
  state.catSort='manual';S.catSort='manual';
  save();render();
  toast('Orden actualizado','success');
}
function moveCat(id,dir){
  var c=catById(id);if(!c||c.parent)return;
  var type=catVisibleType(c);
  var list=sortedCats(type);
  var pos=list.findIndex(function(x){return String(x.id)===String(id);});
  var other=list[pos+dir];
  if(!other)return;
  list[pos]=other;list[pos+dir]=c;
  if(!applyCatOrder(type,list))return;
  state.catSort='manual';S.catSort='manual';
  save();render();
}

function hexHue(hex){
  var r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255;
  var max=Math.max(r,g,b),min=Math.min(r,g,b),d=max-min;
  if(!d)return -1;
  var h;
  if(max===r)h=((g-b)/d)%6;
  else if(max===g)h=(b-r)/d+2;
  else h=(r-g)/d+4;
  h*=60;if(h<0)h+=360;
  return h;
}
function hueGap(a,b){var d=Math.abs(a-b)%360;return d>180?360-d:d;}
function dedupeItemColors(items){
  var accepted=[],used={};
  items.forEach(function(it){
    var c=String(it.color||'').toLowerCase();
    if(/^#[0-9a-f]{6}$/.test(c))used[c]=true;
  });
  items.forEach(function(it){
    var c=String(it.color||'').toLowerCase();
    if(!/^#[0-9a-f]{6}$/.test(c))return;
    var h=hexHue(c);
    var clash=h>=0&&accepted.some(function(a){return a.hue>=0&&hueGap(a.hue,h)<22;});
    if(!clash){accepted.push({hue:h});return;}
    var best=null,bestGap=-1;
    CAT_COLORS.forEach(function(cand){
      var cc=cand.toLowerCase();
      if(used[cc])return;
      var ch=hexHue(cc),gap=360;
      accepted.forEach(function(a){if(a.hue>=0)gap=Math.min(gap,hueGap(a.hue,ch));});
      if(gap>bestGap){bestGap=gap;best=cc;}
    });
    if(best&&bestGap>=22){
      it.color=best;used[best]=true;accepted.push({hue:hexHue(best)});
    }else{
      accepted.push({hue:h});
    }
  });
  return items;
}

return y.id===x.m.personId;})||{name:'Persona'};var col=personColor(x.a,p.id);var isA=x.m.type==='aporte';return '<div class="tx-row"><div class="tx-left"><span class="tx-avatar" style="background:'+col+'22;color:'+col+'">'+esc(initials(p.name))+'</span><div><div class="tx-title">'+esc(p.name)+' <span class="badge '+(isA?'in':'ga')+'">'+(isA?'Aporte':'Retiro')+'</span></div><div class="tx-meta">'+esc(x.a.name)+' · '+esc(dateLabel(x.m.date))+'</div></div></div><span class="tx-amount '+(isA?'in':'ga')+'">'+(isA?'+':'−')+esc(fmt(x.m.amt))+'</span><span></span></div>';}).join('')+'</div>':'')+'</div>';

function vAhorros(){var m=monthTotals(state.cur),prev=monthTotals(addMonth(state.cur,-1));var saved=totalSavings(),jars=totalJars();var rate=m.ingreso>0?m.ahorro/m.ingreso*100:0;var top=categoryTotals('ahorro',state.cur)[0];return '<div class="grid kpis section">'+kpiCard('Ahorro del mes',m.ahorro,prev.ahorro,'ah','savings')+kpiRaw('Tasa de ahorro',pct(rate),'<span>del ingreso del mes</span>','ah','chart')+kpiRaw('Ahorro acumulado',esc(fmt(saved)),'<span>histórico de este espacio</span>','ah','savings')+kpiRaw('En frascos',esc(fmt(jars)),'<span>'+(saved-jars>=0?esc(fmt(saved-jars))+' sin asignar':'más que el ahorro acumulado')+'</span>','wa','target')+'</div><div class="grid dash-main section"><div class="card card-pad"><div class="card-head"><div><h2 class="card-title">Evolución del ahorro</h2><div class="card-desc">Últimos 6 meses</div></div></div>'+barChart(series(6,state.cur),{series:['ahorro'],legend:false})+'</div>'+chartDonutCard('ahorro')+'</div>'+jarsCard()+categorySquaresCard('ahorro')+typeMovementsCard('ahorro');}
function sharedTabs(){return '<div class="shared-tabs">'+S.shared.map(function(a){var t=sharedTotals(a);return '<button class="shared-tab '+(a.id===state.sharedSel?'active':'')+'" onclick="selectShared(\''+a.id+'\')">'+ic('users',14)+esc(a.name)+'<span class="badge">'+esc(fmt0(t.grandTotal))+'</span></button>';}).join('')+'<button class="shared-tab add" onclick="openSharedModal()">'+ic('plus',14)+' Nueva cuenta</button></div>';}

function sharedMoveListHTML(a){var list=(a.moves||[]).slice();if(state.sharedFilter!=='all')list=list.filter(function(m){return m.personId===state.sharedFilter;});list.sort(function(x,y){return y.date.localeCompare(x.date);});if(!list.length)return emptyState('users','Sin movimientos','Registrá el primer aporte o retiro de esta cuenta.','<button class="btn sm primary" onclick="openMoveModal()">Nuevo movimiento</button>');return '<div class="tx-list">'+list.map(function(m){return sharedMoveRow(a,m);}).join('')+'</div>';}

function ownerOptions(a,selected){

function ownerChip(a,ownerId,showEmpty){
  if(!ownerId)return showEmpty?'<span class="owner-chip empty">Sin dueño</span>':'';
  var p=(a.people||[]).find(function(x){return String(x.id)===String(ownerId);});
  if(!p)return showEmpty?'<span class="owner-chip empty">Sin dueño</span>':'';
  var col=personColor(a,p.id);
  return '<span class="owner-chip"><i style="background:'+col+'"></i>'+esc(p.name)+'</span>';
}
function sectionOwner(a,list){
  var ids={};
  (list||[]).forEach(function(c){if(c.owner)ids[c.owner]=1;});
  var keys=Object.keys(ids);
  if(keys.length!==1)return '';
  if((list||[]).some(function(c){return c.owner!==keys[0];}))return '';
  return keys[0];
}
function openSectionOwner(section){
  var a=selectedShared();if(!a)return;
  var name=String(section||'').trim();
  var list=(a.concepts||[]).filter(function(c){return String(c.section||'').trim()===name;});
  if(!list.length){toast('Esa sección no tiene conceptos','error');return;}
  var current=sectionOwner(a,list);
  var body='<div class="form-hint">Se va a asignar el mismo dueño a <b>'+list.length+' concepto'+(list.length===1?'':'s')+'</b> de la sección <b>'+esc(name)+'</b>.</div><label class="form-field"><span class="form-label">Dueño</span><select class="form-select" id="sectionOwner">'+ownerOptions(a,current)+'</select></label><div class="form-hint">Si elegís “Sin dueño”, esos conceptos vuelven a contar como saldo general de la cuenta.</div><div class="form-error" id="formError"></div>';
  openModal({title:'Dueño de la sección',sub:'Asigná quién es responsable de estas líneas.',body:body,footer:[{label:'Cancelar'},{label:'Guardar',cls:'primary',onClick:function(dlg){var v=dlg.querySelector('#sectionOwner').value;list.forEach(function(c){c.owner=v||'';});save();closeModal(dlg);render();toast('Dueño de la sección actualizado');}}]});
}

function openTransferModal(id){
  if(S.cue.length<2){toast('Necesitás al menos dos cuentas para transferir','error');return;}
  var t=id?S.transfers.find(function(x){return x.id===id;}):null;
  var from=t?t.from:S.cue[0].id;
  var to=t?t.to:(S.cue[1]?S.cue[1].id:'');
  var date=t?t.date:(state.cur===todayISO().slice(0,7)?todayISO():state.cur+'-01');
  var amt=t?t.amt:'';
  var note=t?t.note:'';
  function opts(sel){return S.cue.map(function(a){return '<option value="'+a.id+'"'+(String(a.id)===String(sel)?' selected':'')+'>'+esc(a.name)+' · '+esc(fmt(a.amt))+'</option>';}).join('');}
  var body='<div class="form-row"><label class="form-field"><span class="form-label">Desde</span><select class="form-select" id="trFrom">'+opts(from)+'</select></label><label class="form-field"><span class="form-label">Hacia</span><select class="form-select" id="trTo">'+opts(to)+'</select></label></div><div class="form-row"><label class="form-field"><span class="form-label">Monto (USD)</span><input class="form-input" inputmode="decimal" id="trAmt" placeholder="0,00" value="'+amt+'"></label><label class="form-field"><span class="form-label">Fecha</span><input class="form-input" type="date" id="trDate" value="'+date+'"></label></div><label class="form-field"><span class="form-label">Nota <span class="muted">(opcional)</span></span><input class="form-input" id="trNote" placeholder="Ej: pago de tarjeta" value="'+esc(note)+'"></label><div class="form-hint">Resta el monto de la cuenta de origen y lo suma a la de destino. No cuenta como ingreso ni gasto.</div><div class="form-error" id="formError"></div>';
  openModal({title:t?'Editar transferencia':'Nueva transferencia',sub:'Movés dinero entre tus cuentas sin alterar ingresos ni gastos.',body:body,footer:[{label:'Cancelar'},{label:t?'Guardar cambios':'Transferir',cls:'primary',onClick:function(dlg){saveTransfer(id,dlg);}}]});
}
function saveTransfer(id,dlg){
  var from=dlg.querySelector('#trFrom').value;
  var to=dlg.querySelector('#trTo').value;
  var amt=parseAmount(dlg.querySelector('#trAmt').value);
  var date=dlg.querySelector('#trDate').value;
  var note=dlg.querySelector('#trNote').value.trim();
  if(!accountById(from)||!accountById(to)){showFormError('Elegí las dos cuentas.');return;}
  if(from===to){showFormError('La cuenta de origen y destino deben ser distintas.');return;}
  if(!date){showFormError('Elegí una fecha.');return;}
  if(!(amt>0)){showFormError('Ingresá un monto mayor a 0.');return;}
  var old=id?S.transfers.find(function(x){return x.id===id;}):null;
  if(id&&!old)return;
  if(old){adjustAccount(old.from,old.amt);adjustAccount(old.to,-old.amt);}
  var tr=old||{id:uid()};
  tr.date=date;tr.from=from;tr.to=to;tr.amt=amt;tr.note=note;
  if(!old)S.transfers.push(tr);
  adjustAccount(from,-amt);adjustAccount(to,amt);
  save();closeModal(dlg);render();toast(old?'Transferencia actualizada':'Transferencia registrada');
}
function deleteTransfer(id){
  var t=(S.transfers||[]).find(function(x){return x.id===id;});
  if(!t)return;
  var f=accountById(t.from),to=accountById(t.to);
  var route=f&&to?' de <b>'+esc(f.name)+'</b> a <b>'+esc(to.name)+'</b>':'';
  confirmAction('Eliminar transferencia','¿Querés eliminar la transferencia de <b>'+esc(fmt(t.amt))+'</b>'+route+'?','Eliminar',function(){
    adjustAccount(t.from,t.amt);adjustAccount(t.to,-t.amt);
    S.transfers=S.transfers.filter(function(x){return x.id!==id;});
    save();render();toast('Transferencia eliminada');
  },true,'trash');
}

function reconData(){
  var all=allTotals(),accounts=totalAccounts();
  var projected=S.base+all.ingreso-all.gasto-all.ahorro-all.inversion;
  var diff=accounts-projected;
  var withAcc=0,withoutAcc=0,noAccList=[];
  S.tx.forEach(function(t){
    var e=txAccountEffect(t);
    if(t.account)withAcc+=e;
    else{withoutAcc+=e;noAccList.push({t:t,effect:e});}
  });
  noAccList.sort(function(a,b){return b.t.date.localeCompare(a.t.date);});
  var baseGap=accounts-(S.base+withAcc);
  return {all:all,accounts:accounts,projected:projected,diff:diff,withAcc:withAcc,withoutAcc:withoutAcc,noAccList:noAccList,baseGap:baseGap};
}

  if(isNaN(original))original=balance;
  if(original<balance)original=balance;
  if(isNaN(rate)||rate<0)rate=0;
  if(isNaN(payment)||payment<0)payment=0;
  if(!DEBT_TYPES[type])type='otro';
  var old=id?debtById(id):null;
  if(id&&!old)return;
  var d=old||{id:uid(),payments:[]};

  save();closeModal(dlg);render();toast(old?'Deuda actualizada':'Deuda agregada','success');
}

function assetLotCalc(input,field){
  var dlg=input.closest('dialog');if(!dlg)return;
  var q=dlg.querySelector('#assetQty')||dlg.querySelector('#lotQty');
  var amt=dlg.querySelector('#assetAmt')||dlg.querySelector('#lotAmt');
  var pr=dlg.querySelector('#assetPrice')||dlg.querySelector('#lotPrice');
  if(!q||!amt||!pr)return;
  var qv=parseAmount(q.value),av=parseAmount(amt.value),pv=parseAmount(pr.value);
  if(field==='qty'){
    if(qv>0&&av>0)pr.value=Math.round(av/qv*1e8)/1e8;
    else if(qv>0&&pv>0)amt.value=Math.round(qv*pv*100)/100;
  }else if(field==='amt'){
    if(qv>0&&av>0)pr.value=Math.round(av/qv*1e8)/1e8;
    else if(av>0&&pv>0)q.value=Math.round(av/pv*1e8)/1e8;
  }else if(field==='price'){
    if(qv>0&&pv>0)amt.value=Math.round(qv*pv*100)/100;
    else if(av>0&&pv>0)q.value=Math.round(av/pv*1e8)/1e8;
  }
}

async function cgSearch(q){
  var seq=++cgSearchSeq;
  try{

    var box=activeDialog&&activeDialog.querySelector('#cgResults');if(!box)return;
    var coins=(data&&data.coins?data.coins:[]).slice(0,8);
    if(!coins.length){box.innerHTML='<div class="cg-hint">No encontramos esa cripto. Probá con el nombre completo o el símbolo.</div>';return;}
    cgSearchCache={};
    coins.forEach(function(c){cgSearchCache[c.id]={name:c.name,symbol:c.symbol};});
    box.innerHTML=coins.map(function(c){
      var sym=String(c.symbol||'').toUpperCase();
      var img=c.thumb?'<img src="'+esc(c.thumb)+'" alt="" loading="lazy" onerror="this.style.visibility=\'hidden\'">':'<span class="cg-fallback">'+esc(sym.slice(0,3)||'?')+'</span>';
      return '<button type="button" class="cg-result" onclick="cgPick(\''+esc(c.id)+'\')">'+img+'<span class="cg-result-info"><b>'+esc(c.name)+'</b><small>'+esc(sym)+'</small></span>'+(c.market_cap_rank?'<span class="cg-rank">#'+Number(c.market_cap_rank)+'</span>':'')+'</button>';
    }).join('');
  }catch(e){
    if(seq!==cgSearchSeq)return;
    var box2=activeDialog&&activeDialog.querySelector('#cgResults');
    if(box2)box2.innerHTML='<div class="cg-hint err">'+esc(e.message||'No se pudo buscar.')+'</div>';
  }

function saveAsset(id,dlg){
  var kindEl=dlg.querySelector('#assetKind');
  var kind=kindEl&&ASSET_KINDS[kindEl.value]?kindEl.value:'cripto';
  var name=dlg.querySelector('#assetName').value.trim();
  var ticker=dlg.querySelector('#assetTicker').value.trim();
  if(!name){showFormError('Ponele un nombre a la inversión.');return;}
  var old=id?assetById(id):null;
  if(id&&!old)return;
  var a=old||{id:uid(),lots:[]};
  if(old)kind=a.kind;
  a.kind=kind;
  a.name=name;
  a.ticker=kind==='negocio'?'':ticker;
  a.note=dlg.querySelector('#assetNote').value.trim();
  var cgId=kind==='cripto'&&dlg.querySelector('#assetCgId')?String(dlg.querySelector('#assetCgId').value||'').trim().toLowerCase().replace(/[^a-z0-9-]/g,''):'';
  if(kind==='negocio'){
    var invested=parseAmount(dlg.querySelector('#assetBizInvested').value);
    var valuation=parseAmount(dlg.querySelector('#assetValuation').value);
    var ownership=parseAmount(dlg.querySelector('#assetOwnership').value);
    var received=parseAmount(dlg.querySelector('#assetReceived').value);
    var revenue=parseAmount(dlg.querySelector('#assetRevenue').value);
    var costs=parseAmount(dlg.querySelector('#assetCosts').value);
    if(isNaN(invested)||invested<0){showFormError('Ingresá un capital aportado válido.');return;}
    if(isNaN(valuation)||valuation<0)valuation=0;
    if(isNaN(ownership))ownership=100;
    ownership=clamp(ownership,0,100);
    if(isNaN(received)||received<0)received=0;
    if(isNaN(revenue)||revenue<0)revenue=0;
    if(isNaN(costs)||costs<0)costs=0;
    a.invested=Math.round(invested*100)/100;
    a.valuation=Math.round(valuation*100)/100;
    a.ownership=ownership;
    a.received=Math.round(received*100)/100;
    a.revenue=Math.round(revenue*100)/100;
    a.costs=Math.round(costs*100)/100;
    a.startDate=dlg.querySelector('#assetStartDate').value||'';
    a.sector=dlg.querySelector('#assetSector').value.trim();
    a.role=ASSET_ROLES[dlg.querySelector('#assetRole').value]?dlg.querySelector('#assetRole').value:'socio';
    a.status=ASSET_STATUS[dlg.querySelector('#assetStatus').value]?dlg.querySelector('#assetStatus').value:'activo';
    a.lots=[];
    a.cgId='';a.priceSource='';a.priceUpdatedAt=0;
  }else{
    var price=parseAmount(dlg.querySelector('#assetCurPrice').value);
    if(isNaN(price)||price<0)price=0;
    a.price=price;
    a.priceDate=price>0?(dlg.querySelector('#assetPriceDate').value||todayISO()):'';
    var prevPrice=old?(Number(old.price)||0):0;
    var pu=Number(dlg.querySelector('#assetPriceUpdatedAt')?dlg.querySelector('#assetPriceUpdatedAt').value:0)||0;
    a.cgId=cgId;
    a.priceSource=cgId?'coingecko':'';
    a.priceUpdatedAt=cgId&&price>0?(Math.abs(price-prevPrice)>1e-9?Date.now():(pu||Date.now())):0;
    if(!old){
      var qty=parseAmount(dlg.querySelector('#assetQty').value);
      var amt=parseAmount(dlg.querySelector('#assetAmt').value);
      var unit=parseAmount(dlg.querySelector('#assetPrice').value);
      if(!(qty>0)){showFormError('Ingresá la cantidad comprada.');return;}
      if(!(amt>0)){
        if(unit>0)amt=qty*unit;
        else{showFormError('Ingresá el monto invertido o el precio de entrada.');return;}
      }
      a.lots=[{id:uid(),date:dlg.querySelector('#assetLotDate').value||todayISO(),qty:qty,amount:Math.round(amt*100)/100,price:amt/qty,note:''}];
    }
  }
  if(!old)S.assets.push(a);
  save();closeModal(dlg);render();toast(old?'Inversión actualizada':'Inversión agregada','success');
  if(a.cgId)priceRefreshSoon();
}

function saveLot(assetId,lotId,dlg){
  var a=assetById(assetId);if(!a)return;
  var qty=parseAmount(dlg.querySelector('#lotQty').value);
  var amt=parseAmount(dlg.querySelector('#lotAmt').value);
  var unit=parseAmount(dlg.querySelector('#lotPrice').value);
  var date=dlg.querySelector('#lotDate').value||todayISO();
  var note=dlg.querySelector('#lotNote').value.trim();
  if(!(qty>0)){showFormError('Ingresá una cantidad mayor a 0.');return;}
  if(!(amt>0)){
    if(unit>0)amt=qty*unit;
    else{showFormError('Ingresá el monto invertido o el precio de entrada.');return;}
  }
  var lot=lotId?(a.lots||[]).find(function(x){return x.id===lotId;}):null;
  if(lot){lot.date=date;lot.qty=qty;lot.amount=Math.round(amt*100)/100;lot.price=amt/qty;lot.note=note;}
  else{a.lots=a.lots||[];a.lots.push({id:uid(),date:date,qty:qty,amount:Math.round(amt*100)/100,price:amt/qty,note:note});}
  save();closeModal(dlg);render();openAssetDetail(assetId);toast(lot?'Compra actualizada':'Compra agregada','success');
}

    lockText+

    '<div class="form-field"><span class="form-label">Color <span class="muted">(opcional)</span></span><div class="color-picker">'+colorChoices+'<label class="color-custom" title="Color personalizado"><input type="color" value="'+(/^#[0-9a-f]{6}$/i.test(color)?color:'#3b82f6')+'" oninput="pickCatColor(this.value)">'+ic('palette',13)+'</label></div><input type="hidden" id="catColor" value="'+color+'" data-auto="'+(autoColor?'1':'0')+'"></div>'+

function updateCatPreview(){
  var dlg=activeDialog;if(!dlg)return;
  var nameEl=dlg.querySelector('#catName');if(!nameEl)return;
  var iconInp=dlg.querySelector('#catIcon'),colorInp=dlg.querySelector('#catColor');
  if(!iconInp||!colorInp)return;
  var name=nameEl.value.trim()||'Nueva categoría';
  var icon=iconInp.dataset.auto==='1'?autoIconFor(name):iconInp.value;
  var color=colorInp.dataset.auto==='1'?defaultCatColor(name):colorInp.value;
  if(iconInp.dataset.auto==='1')iconInp.value=icon;
  if(colorInp.dataset.auto==='1')colorInp.value=color;
  var av=dlg.querySelector('#catPreviewAvatar');
  if(av){av.style.background=color+'22';av.style.color=color;av.innerHTML=ic(icon,19);}
  var pn=dlg.querySelector('#catPreviewName');if(pn)pn.textContent=name;
  var typeSel=dlg.querySelector('#catType');
  var meta=dlg.querySelector('#catPreviewMeta');
  if(meta)meta.textContent=typeName(typeSel?typeSel.value:'gasto')+(dlg.dataset.editing==='1'?' · Categoría existente':' · Nueva categoría');
  dlg.querySelectorAll('.icon-choice').forEach(function(b){b.classList.toggle('active',b.getAttribute('data-icon')===icon);});
  dlg.querySelectorAll('.color-choice').forEach(function(b){b.classList.toggle('active',String(b.getAttribute('data-color')).toLowerCase()===String(color).toLowerCase());});
  var custom=dlg.querySelector('.color-custom input');
  if(custom&&colorInp.dataset.auto!=='1'&&/^#[0-9a-f]{6}$/i.test(color))custom.value=color;
}
function pickCatIcon(name){
  var dlg=activeDialog;if(!dlg)return;

function pickCatColor(hex){
  var dlg=activeDialog;if(!dlg)return;

function handleImportFile(file){
  if(!file)return;
  if(file.size>10*1024*1024){toast('El archivo es demasiado grande (máximo 10 MB)','error');return;}
  var reader=new FileReader();
  reader.onload=function(){
    try{
      var raw=String(reader.result||'').replace(/^\uFEFF/,'');
      var d=JSON.parse(raw);
      if(!d||typeof d!=='object'||(!Array.isArray(d.profs)&&!Array.isArray(d.tx)&&!Array.isArray(d.cats)))throw new Error('formato');
      var root=normalizeRoot(d);
      var totalTx=sum(root.profs,function(p){return p.tx.length;});
      var totalCue=sum(root.profs,function(p){return p.cue.length;});
      var totalCats=sum(root.profs,function(p){return p.cats.length;});
      var totalAssets=sum(root.profs,function(p){return p.assets.length;});
      if(!totalTx&&!totalCue&&!totalCats&&!totalAssets)throw new Error('vacio');
      var rawName='';
      if(d.name)rawName=String(d.name).trim();
      else if(Array.isArray(d.profs)&&d.profs.length===1&&d.profs[0]&&d.profs[0].name)rawName=String(d.profs[0].name).trim();

      renderImportPreview();
    }catch(e){console.warn('No se pudo importar el archivo',e);toast('El archivo no es una copia válida','error');}

var SYNC_CFG_KEY='finanzas_sync_v1';
var SYNC_SQL=`-- Mis finanzas · sincronización entre dispositivos
-- Pegá todo este script en Supabase → SQL Editor → Run.

create extension if not exists pgcrypto;

create table if not exists public.finance_spaces (
  id uuid primary key default gen_random_uuid(),
  code text not null unique,
  data jsonb not null default '{}'::jsonb,
  rev bigint not null default 0,
  updated_at timestamptz not null default now()
);

alter table public.finance_spaces enable row level security;

create or replace function public.finance_create_space()
returns jsonb
language plpgsql
security definer
set search_path = public
as $$
declare
  v_code text;
  v_id uuid;
begin
  loop
    v_code := upper(substr(replace(gen_random_uuid()::text, '-', ''), 1, 16));
    exit when not exists (select 1 from public.finance_spaces where code = v_code);
  end loop;
  insert into public.finance_spaces(code) values (v_code) returning id into v_id;
  return jsonb_build_object('id', v_id, 'code', v_code);
end;
$$;

create or replace function public.finance_get_meta(p_code text)
returns jsonb
language sql
security definer
set search_path = public
as $$
  select jsonb_build_object('rev', rev, 'updated_at', updated_at)
  from public.finance_spaces
  where code = upper(replace(p_code, '-', ''));
$$;

create or replace function public.finance_get_space(p_code text)
returns jsonb
language sql
security definer
set search_path = public
as $$
  select jsonb_build_object('data', data, 'rev', rev, 'updated_at', updated_at)
  from public.finance_spaces
  where code = upper(replace(p_code, '-', ''));
$$;

create or replace function public.finance_save_space(p_code text, p_data jsonb, p_base_rev bigint)
returns jsonb
language plpgsql
security definer
set search_path = public
as $$
declare
  v_rev bigint;
  v_code text;
begin
  v_code := upper(replace(p_code, '-', ''));
  if not exists (select 1 from public.finance_spaces where code = v_code) then
    raise exception 'Código inválido';
  end if;
  update public.finance_spaces
  set data = p_data, rev = rev + 1, updated_at = now()
  where code = v_code and rev = p_base_rev
  returning rev into v_rev;
  if v_rev is null then
    return jsonb_build_object('conflict', true, 'rev', (select rev from public.finance_spaces where code = v_code));
  end if;
  return jsonb_build_object('conflict', false, 'rev', v_rev);
end;
$$;

revoke all on table public.finance_spaces from anon, authenticated;
revoke all on function public.finance_create_space() from public;
revoke all on function public.finance_get_meta(text) from public;
revoke all on function public.finance_get_space(text) from public;
revoke all on function public.finance_save_space(text, jsonb, bigint) from public;
grant execute on function public.finance_create_space() to anon, authenticated;
grant execute on function public.finance_get_meta(text) to anon, authenticated;
grant execute on function public.finance_get_space(text) to anon, authenticated;
grant execute on function public.finance_save_space(text, jsonb, bigint) to anon, authenticated;

notify pgrst, 'reload schema';`;

function syncHash(str){

function syncStable(v){

  if(Array.isArray(v))return '['+v.map(syncStable).join(',')+']';
  var keys=Object.keys(v).filter(function(k){return v[k]!==undefined;}).sort();
  return '{'+keys.map(function(k){return JSON.stringify(k)+':'+syncStable(v[k]);}).join(',')+'}';

async function syncRpc(fn,args){
  var ctrl=typeof AbortController!=='undefined'?new AbortController():null;
  var timer=ctrl?setTimeout(function(){ctrl.abort();},12000):null;
  try{
    var res=await fetch(syncEndpoint(fn),{
      method:'POST',
      headers:syncHeaders(),
      body:JSON.stringify(args||{}),
      signal:ctrl?ctrl.signal:undefined
    });
    var text=await res.text();
    var data=null;
    if(text){try{data=JSON.parse(text);}catch(e){data=text;}}
    if(!res.ok){
      var msg=(data&&data.message)||('Error '+res.status);
      if(res.status===404)msg='No se encontró la función en Supabase. Ejecutá el SQL de configuración.';
      if(res.status===401||res.status===403)msg='La clave de Supabase no es válida o no tiene permisos.';
      throw new Error(msg);
    }
    return data;
  }catch(e){
    if(e&&e.name==='AbortError')throw new Error('Sin respuesta de Supabase. Revisá tu conexión.');
    throw e;
  }finally{
    if(timer)clearTimeout(timer);

function syncCopyFallback(text){
  var ta=document.createElement('textarea');
  ta.value=String(text);
  ta.style.position='fixed';ta.style.opacity='0';
  document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');}catch(e){}
  ta.remove();
}
function syncCopy(text,okMsg){
  var done=function(){toast(okMsg||'Copiado','success');};
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(String(text)).then(done).catch(function(){syncCopyFallback(text);done();});
  }else{syncCopyFallback(text);done();}
}

  syncCfg.url=url;syncCfg.key=key;
  syncSetStatus('syncing','Probando conexión…');
  try{
    await syncRpc('finance_get_meta',{p_code:'TEST'});
    saveSyncCfg();

    render();

async function syncJoin(dlg){
  var inp=dlg.querySelector('#syncJoinCode');
  var code=syncNormalizeCode(inp?inp.value:'');
  if(code.length!==16){showFormError('El código tiene 16 caracteres.');return;}
  var btn=dlg.querySelector('.modal-foot .btn.primary');
  if(btn){btn.disabled=true;btn.textContent='Uniendo…';}
  var prev={code:syncCfg.code,rev:syncCfg.rev,hash:syncCfg.hash};
  try{
    var full=await syncRpc('finance_get_space',{p_code:code});
    if(!full)throw new Error('Código inválido o espacio inexistente.');
    var remoteData=full.data;
    syncCfg.code=code;
    syncCfg.rev=Number(full.rev)||0;
    syncCfg.hash='';
    if(remoteData&&Array.isArray(remoteData.profs)&&remoteData.profs.length){
      if(!syncApplyRemote(remoteData,syncCfg.rev,{silent:true}))throw new Error('No se pudieron leer los datos del espacio.');
    }else{
      syncCfg.rev=0;
      saveSyncCfg();
      var ok=await syncPush(true);
      if(!ok)throw new Error('El espacio está vacío y no se pudieron subir los datos de este dispositivo.');
    }
    closeModal(dlg);
    syncStartPolling();
    render();
    toast('Espacio vinculado. Tus datos ya están sincronizados.','success');
  }catch(e){
    syncCfg.code=prev.code;syncCfg.rev=prev.rev;syncCfg.hash=prev.hash;
    saveSyncCfg();
    if(btn){btn.disabled=false;btn.textContent='Unirme';}
    showFormError(e.message||'No se pudo unir al espacio.');
  }
}

function syncOnLocalSave(){
  if(syncApplying)return;
  if(!syncCfg.code)return;
  if(syncHash(syncPayload())===syncCfg.hash)return;
  syncDirty=true;
  syncSetStatus('syncing','Cambios pendientes de enviar…');
  if(syncPushTimer)clearTimeout(syncPushTimer);
  syncPushTimer=setTimeout(function(){
    syncPushTimer=null;
    if(syncBusy){syncOnLocalSave();return;}
    syncPush();
  },700);
}
async function syncPush(force){
  if(!syncCfg.code||syncApplying)return false;
  if(syncBusy)return false;
  if(!navigator.onLine){syncSetStatus('offline','Sin conexión. Los cambios se enviarán al reconectar.');return false;}
  var payload=syncPayload();
  var pushedHash=syncHash(payload);
  if(!force&&pushedHash===syncCfg.hash){
    syncDirty=false;
    syncSetStatus('ok','Tus datos están al día.');
    return true;
  }
  syncBusy=true;
  var base=Number(syncCfg.rev)||0;
  try{
    var res=await syncRpc('finance_save_space',{p_code:syncCfg.code,p_data:JSON.parse(payload),p_base_rev:base});
    if(!res)throw new Error('Respuesta vacía de Supabase.');
    if(res.conflict){
      var full=await syncRpc('finance_get_space',{p_code:syncCfg.code});
      if(!full)throw new Error('El espacio ya no existe.');
      if(syncHash(syncStable(full.data||{}))===pushedHash){
        syncCfg.rev=Number(full.rev)||0;
        syncCfg.hash=pushedHash;
        syncCfg.lastSync=Date.now();
        saveSyncCfg();syncDirty=false;
        syncSetStatus('ok','Tus datos están al día.');
        return true;
      }
      syncDirty=true;
      syncPaused=true;
      syncConflictRemote=full;
      syncSetStatus('conflict','Hay cambios de otro dispositivo sin resolver.');
      syncConflictModal(full);
      return false;
    }
    syncCfg.rev=Number(res.rev)||0;
    syncCfg.hash=pushedHash;
    syncCfg.lastSync=Date.now();
    syncDirty=syncHash(syncPayload())!==pushedHash;
    saveSyncCfg();
    syncSetStatus(syncDirty?'syncing':'ok',syncDirty?'Cambios pendientes de enviar…':'Tus datos están al día.');
    return true;
  }catch(e){
    var msg=e.message||'No se pudo sincronizar.';
    if(/Failed to fetch|NetworkError|Load failed/i.test(msg))msg='Sin conexión con Supabase. Los cambios se guardarán y se enviarán al reconectar.';
    syncSetStatus(/SQL|clave|función|Código inválido/i.test(msg)?'error':'offline',msg);
    return false;
  }finally{
    syncBusy=false;
  }
}
function syncTxCount(data){
  if(!data||!Array.isArray(data.profs))return 0;
  return data.profs.reduce(function(n,p){return n+((p&&Array.isArray(p.tx))?p.tx.length:0);},0);
}

function syncApplyRemote(data,rev,opts){
  opts=opts||{};
  if(!data||!Array.isArray(data.profs)||!data.profs.length)return false;
  syncApplying=true;
  try{
    var prevAct=S&&S.id?S.id:'';
    R=normalizeRoot(data);
    if(prevAct&&R.profs.some(function(p){return p.id===prevAct;}))R.act=prevAct;
    try{localStorage.setItem(KEY,JSON.stringify({v:2,act:R.act,profs:R.profs}));}catch(e){}
    pick();
    render();
  }catch(e){
    syncApplying=false;
    return false;
  }
  syncApplying=false;
  syncCfg.rev=Number(rev)||0;
  syncCfg.hash=syncHash(syncPayload());
  syncCfg.lastSync=Date.now();
  saveSyncCfg();
  syncDirty=false;
  syncPaused=false;
  syncConflictRemote=null;
  syncSetStatus('ok','Tus datos están al día.');
  if(!opts.silent)toast('Datos actualizados desde otro dispositivo','success');
  return true;
}
async function syncPoll(initial){
  if(!syncCfg.code||syncBusy||syncPaused)return;
  if(document.visibilityState==='hidden'&&!initial)return;
  if(activeDialog&&!initial)return;
  if(!navigator.onLine){syncSetStatus('offline','Sin conexión. Los cambios se enviarán al reconectar.');return;}
  if(syncDirty&&!initial){syncPush();return;}
  var pushNeeded=false;
  syncBusy=true;
  try{
    var meta=await syncRpc('finance_get_meta',{p_code:syncCfg.code});
    if(meta===null){
      syncStopPolling();
      syncSetStatus('error','El código del espacio no existe en Supabase.');
      return;
    }
    var localPayload=syncPayload();
    var localHash=syncHash(localPayload);
    var dirty=localHash!==syncCfg.hash;
    if(Number(meta.rev)>Number(syncCfg.rev)){
      if(dirty){
        var full=await syncRpc('finance_get_space',{p_code:syncCfg.code});
        if(full){
          if(syncHash(syncStable(full.data||{}))===localHash){
            syncCfg.rev=Number(full.rev)||0;
            syncCfg.hash=localHash;
            syncCfg.lastSync=Date.now();
            saveSyncCfg();syncDirty=false;
            syncSetStatus('ok','Tus datos están al día.');
          }else{
            syncPaused=true;
            syncConflictRemote=full;
            syncSetStatus('conflict','Hay cambios de otro dispositivo sin resolver.');
            syncConflictModal(full);
          }
        }
      }else{
        var full2=await syncRpc('finance_get_space',{p_code:syncCfg.code});
        if(full2)syncApplyRemote(full2.data,full2.rev,{silent:!initial});
      }
    }else if(Number(meta.rev)===Number(syncCfg.rev)){
      if(dirty)pushNeeded=true;
      else syncSetStatus('ok','Tus datos están al día.');
    }else{
      pushNeeded=true;
    }
  }catch(e){
    var msg=e.message||'Sin conexión';
    syncSetStatus(/SQL|clave|función/i.test(msg)?'error':'offline',msg);
  }finally{
    syncBusy=false;
  }
  if(pushNeeded)syncPush();
}
function syncStartPolling(){
  syncStopPolling();
  if(!syncCfg.code)return;
  syncBindEvents();
  syncTimer=setInterval(function(){syncPoll(false);},5000);
  syncPoll(true);
}
function syncStopPolling(){
  if(syncTimer){clearInterval(syncTimer);syncTimer=null;}
}
function syncBindEvents(){
  if(syncEventsBound)return;
  syncEventsBound=true;
  window.addEventListener('online',function(){syncSetStatus('syncing','Reconectando…');syncPoll(false);});
  window.addEventListener('offline',function(){syncSetStatus('offline','Sin conexión. Los cambios se guardan localmente.');});
  document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')syncPoll(false);});
  window.addEventListener('focus',function(){syncPoll(false);});
  window.addEventListener('pagehide',syncFlush);
}
function syncFlush(){
  if(!syncDirty||!syncCfg.code||!navigator.onLine)return;
  try{
    var payload=syncPayload();
    fetch(syncEndpoint('finance_save_space'),{
      method:'POST',
      headers:syncHeaders(),
      body:JSON.stringify({p_code:syncCfg.code,p_data:JSON.parse(payload),p_base_rev:Number(syncCfg.rev)||0}),
      keepalive:true
    });
  }catch(e){}
}
async function syncNow(){
  if(!syncCfg.code){toast('Primero creá o unite a un espacio','error');return;}
  syncSetStatus('syncing','Sincronizando…');
  var dirty=syncHash(syncPayload())!==syncCfg.hash;
  if(dirty)await syncPush();
  else await syncPoll(false);
  if(syncState.state==='ok')toast('Todo sincronizado','success');
}
function syncInit(){
  syncLoadCfg();
  syncBindEvents();
  syncRenderNote();
  if(!syncCfg.url||!syncCfg.key){
    syncSetStatus('off','Solo en este navegador');
    return;
  }
  if(!syncCfg.code){
    syncSetStatus('ready','Conectado a Supabase. Creá un espacio o unite con un código.');
    return;
  }
  syncSetStatus('syncing','Conectando…');
  syncStartPolling();
}

function bindGlobal(){document.addEventListener('click',function(e){var w=document.querySelector('.ws-wrap');if(w&&!w.contains(e.target))closeWsMenu();});document.addEventListener('keydown',function(e){if(e.key==='Escape'){closeWsMenu();closeSidebar();}if((e.key==='n'||e.key==='N')&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&document.activeElement&&['INPUT','SELECT','TEXTAREA'].indexOf(document.activeElement.tagName)===-1&&!activeDialog)quickAdd();});window.addEventListener('resize',function(){if(window.innerWidth>900)closeSidebar();});if(window.matchMedia){var mq=window.matchMedia('(prefers-color-scheme: dark)');var onChange=function(){if(getThemePref()==='auto')applyTheme();};if(mq.addEventListener)mq.addEventListener('change',onChange);else if(mq.addListener)mq.addListener(onChange);}var si=$('sideSettingsIcon');if(si)si.innerHTML=ic('settings',16);var ii=$('sideImportIcon');if(ii)ii.innerHTML=ic('upload',16);}
function init(){applyTheme();render();bindGlobal();syncInit();priceInit();}
init();

</script>
